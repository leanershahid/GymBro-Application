<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      App-like viewport on phones: no pinch zoom, no double-tap zoom, and no automatic zoom
      when an input is focused (iOS Safari zooms into inputs unless maximum-scale is 1).
      viewport-fit=cover lets the layout use the safe-area insets on notched phones.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#0A0F0A" />
    <title>GymBro</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #0A0F0A;
        /* Stop iOS/Android inflating text sizes in landscape */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        /* Remove the 300ms double-tap-to-zoom gesture */
        touch-action: manipulation;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /*
        Boot splash: shown while the JS bundle downloads, then removed by <BootSplash>
        (src/features/common/components/LogoLoader.tsx), which draws the same thing.
        Colours match theme.ts: bg #0A0F0A, logoLime #D4ED35.
      */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0A0F0A;
      }
      #boot-splash .glow {
        position: relative; width: 163px; height: 163px;
        display: flex; align-items: center; justify-content: center;
      }
      #boot-splash .glow::before, #boot-splash .glow::after {
        content: ''; position: absolute; border-radius: 50%;
        background: rgba(212, 237, 53, 0.14);
      }
      #boot-splash .glow::before { inset: 0; animation: gb-halo 1.8s ease-in-out infinite; }
      #boot-splash .glow::after  { inset: 23px; background: rgba(212, 237, 53, 0.12); animation: gb-core 1.8s ease-in-out infinite; }
      #boot-splash img {
        position: relative; width: 96px; height: auto;
        animation: gb-intro 0.5s cubic-bezier(.34,1.56,.64,1) both, gb-breathe 1.8s ease-in-out infinite;
      }
      #boot-splash .track {
        width: 106px; height: 3px; margin-top: 4px; border-radius: 2px; overflow: hidden;
        background: rgba(212, 237, 53, 0.15);
      }
      #boot-splash .bar {
        width: 40%; height: 100%; border-radius: 2px; background: #D4ED35;
        animation: gb-sweep 1.3s ease-in-out infinite;
      }
      @keyframes gb-intro   { from { opacity: 0; scale: 0.6; } to { opacity: 1; scale: 1; } }
      @keyframes gb-breathe { 0%, 100% { transform: scale(0.95) rotate(-3deg); } 50% { transform: scale(1.04) rotate(3deg); } }
      @keyframes gb-halo    { 0%, 100% { opacity: 0.35; transform: scale(0.78); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes gb-core    { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      @keyframes gb-sweep   { from { transform: translateX(-100%); } to { transform: translateX(265%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash * , #boot-splash .glow::before, #boot-splash .glow::after { animation: none !important; }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="boot-splash" role="progressbar" aria-label="Loading GymBro">
      <div class="glow"><img src="/logo-mark.png" alt="" /></div>
      <div class="track"><div class="bar"></div></div>
    </div>
  </body>
</html>
