name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/GymManagmentApplication-27-06-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
      # The solution builds the API and the tests (the API is also built on its own by the test project reference).
      - run: dotnet restore GymManagmentApplication.slnx
      - run: dotnet build GymManagmentApplication.slnx --no-restore -c Release
      - run: dotnet test GymManagmentApplication.Tests/GymManagmentApplication.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx"
      - name: Vulnerable NuGet packages
        run: |
          dotnet list GymManagmentApplication/GymManagmentApplication.csproj package --vulnerable --include-transitive | tee vuln.txt
          if grep -qE "\b(High|Critical)\b" vuln.txt; then echo "::error::High/critical vulnerable packages found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/GymManagmentApplication-27-06-2026/GymManagmentApplication.Tests/TestResults

  backend-docker:
    # Same build Render runs (render.yaml: dockerContext = backend root).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f GymManagmentApplication/Dockerfile -t gymbro-api:ci .
        working-directory: backend/GymManagmentApplication-27-06-2026

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/GymManagmentApplicationFrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/GymManagmentApplicationFrontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Same export Vercel runs, so a broken web build fails here instead of on deploy.
      - run: npx expo export --platform web
