name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/GymManagmentApplication-27-06-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore GymManagmentApplication.Tests/GymManagmentApplication.Tests.csproj
      - run: dotnet build GymManagmentApplication.Tests/GymManagmentApplication.Tests.csproj --no-restore -c Release
      - run: dotnet test GymManagmentApplication.Tests/GymManagmentApplication.Tests.csproj --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/GymManagmentApplicationFrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/GymManagmentApplicationFrontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
